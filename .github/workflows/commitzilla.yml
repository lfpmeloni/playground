name: commitzilla

# Paints one square of the dragon each night. See commitzilla/AGENT_BRIEF.md.
#
# Fires at 23:40 America/Sao_Paulo (02:40 UTC). Actions routinely delays
# scheduled runs, so paint.py is given --for-scheduled-day: a run that slips
# past local midnight still paints the night it was meant for instead of
# jumping a day and leaving a hole.
#
# The same workflow is the cloud supervisor's eyes and hands. The Claude Code
# routine's sandbox can reach only the REST API: no GraphQL, no github.com
# pages (so no calendar), and anything it pushed would count on the graph. So
# commitzilla/scripts/dispatch.py fires this with `supervise: true`: the check
# (verify.py), the repairs (paint.py) and the notes (record.py) all happen
# here, attributed to github-actions[bot] and so worth 0 contributions.

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to paint (YYYY-MM-DD). Blank = tonight."
        required: false
      extra:
        description: "Extra commits on top of the schedule (repair)."
        required: false
        default: "0"
      dry_run:
        description: "Print what would happen and touch nothing."
        type: boolean
        default: false
      supervise:
        description: "Supervisor mode: check the last 14 days, repair pale squares, record notes. Skips tonight's paint."
        type: boolean
        default: false
      note:
        description: "Supervisor mode: optional free text appended to the journal line."
        required: false

concurrency:
  group: commitzilla
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  paint:
    # Pinned, not ubuntu-latest: that label migrates to Ubuntu 26 on 2026-10-19
    # and this job has to keep working unattended for a year.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A PAT here makes the push unambiguously the user's. Falls back to
          # the built-in token, which works as long as the commits are AUTHORED
          # with an account-linked email -- which paint.py always does.
          token: ${{ secrets.COMMITZILLA_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Blackout guard
        # 2027-08-10 is the dragon's eye, the only black square of the year.
        # One contribution of any kind lights it, permanently.
        run: python3 commitzilla/scripts/blackout.py

      - name: Paint tonight's square
        if: ${{ !inputs.supervise }}
        env:
          GH_TOKEN: ${{ secrets.COMMITZILLA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 commitzilla/scripts/paint.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '--for-scheduled-day' }} \
            ${{ inputs.extra != '0' && inputs.extra != '' && format('--extra {0}', inputs.extra) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Re-render progress
        if: ${{ !inputs.dry_run && !inputs.supervise }}
        env:
          GH_TOKEN: ${{ secrets.COMMITZILLA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 commitzilla/scripts/verify.py --days 21 \
            || echo "::warning::graph read-back failed -- tonight's square is unchecked"
          python3 commitzilla/scripts/render.py --target
          python3 commitzilla/scripts/render.py --actual || true

      # ---- supervisor mode (dispatched by the cloud routine) ----
      # Inputs go through env, never ${{ }} inside run: the note is free text.

      - name: Check the graph
        id: check
        if: ${{ inputs.supervise }}
        run: |
          # A failed read-back fails the run (bash -e): stop rather than guess.
          # The report goes to stderr (the log); stdout is just DATE:N,DATE:N.
          spec=$(python3 commitzilla/scripts/verify.py --days 14 --json "$RUNNER_TEMP/check.json" --repair-spec)
          echo "repairs: [$spec]"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Repair pale squares
        if: ${{ inputs.supervise && steps.check.outputs.spec != '' }}
        env:
          GH_TOKEN: ${{ secrets.COMMITZILLA_TOKEN || secrets.GITHUB_TOKEN }}
          REPAIRS: ${{ steps.check.outputs.spec }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          IFS=',' read -ra ITEMS <<< "$REPAIRS"
          for item in "${ITEMS[@]}"; do
            d="${item%%:*}"; n="${item##*:}"
            [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$n" =~ ^[0-9]+$ && "$n" -le 40 ]] || { echo "bad repair: $item"; exit 1; }
            python3 commitzilla/scripts/paint.py --date "$d" --extra "$n" $DRY
          done

      - name: Record supervisor notes
        if: ${{ inputs.supervise }}
        env:
          # Built-in token ONLY: a PAT here would make the PR and merge Felipe's,
          # adding 2 contributions to whatever day this runs on.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTE: ${{ inputs.note }}
          REPAIRED: ${{ steps.check.outputs.spec }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python3 commitzilla/scripts/record.py --check "$RUNNER_TEMP/check.json" \
            --repaired "$REPAIRED" --note "$NOTE" $DRY
